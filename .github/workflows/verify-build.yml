name: Verify Hora Extra build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.4.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build application
        run: npm run build

  e2e:
    name: E2E (interface)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      HE_OWNER_EMAIL: ${{ secrets.HE_E2E_OWNER_EMAIL }}
      HE_COLLAB_EMAIL: ${{ secrets.HE_E2E_COLLAB_EMAIL }}
      HE_VIEWER_EMAIL: ${{ secrets.HE_E2E_VIEWER_EMAIL }}
      HE_PASSWORD: ${{ secrets.HE_E2E_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.4.0
        with:
          node-version: '22'
      - name: Install dependencies and Chromium
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Build and start
        run: npm run build && (npm start -- -p 3000 &) && npx --yes wait-on http://localhost:3000
      - name: Run Playwright
        run: npm run test:e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
